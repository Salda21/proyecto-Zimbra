<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | ZimbraConnect</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/autenticacion.css">
    <link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>

    <main class="auth-page">

        <aside class="auth-brand">
            <div class="plane">➤</div>
            <h2>ZimbraConnect</h2>
            <p>Tu espacio de comunicación y productividad</p>
        </aside>

        <section class="auth-panel">
            <div class="auth-card card">

                <div id="resetPassword">

                    <div class="eyebrow">Seguridad de la cuenta</div>

                    <h1>Restablecer contraseña</h1>

                    <p class="muted">
                        Ingresa tu correo y define tu nueva contraseña.
                    </p>

                    <form id="resetPasswordForm" action="PHP/reestablecer_contraseña.php" method="POST" novalidate>

                        <div class="field">
                            <label for="email">Correo electrónico</label>
                            <input type="email" name="email" id="email"
                                placeholder="correo@empresa.com" required>
                            <small class="mensaje-error" id="errorEmail"></small>
                        </div>

                        <div class="field">
    <label for="password">Nueva contraseña</label>
    <div class="campo-password">
        <input type="password" name="password" id="password"
            minlength="8" placeholder="Mínimo 8 caracteres" required>
        <i class="bx bx-eye-alt toggle-password" id="togglePassword"
            title="Mostrar u ocultar contraseña"></i>
    </div>
    <small class="mensaje-error" id="errorPassword"></small>
</div>

                        <div class="field">
                            <label for="confirmarPassword">Confirmar nueva contraseña</label>
                            <div class="campo-password">
                                <input type="password" name="confirmarPassword" id="confirmarPassword"
                                    minlength="8" placeholder="Repite tu nueva contraseña" required>
                                <i class="bx bx-eye-alt toggle-password" id="toggleConfirmPassword"
                                    title="Mostrar u ocultar contraseña"></i>
                            </div>
                            <small class="mensaje-error" id="errorConfirmar"></small>
                        </div>

                        <button class="btn btn-primary" type="submit">
                            Actualizar contraseña
                        </button>

                    </form>

                    <p class="muted" style="text-align:center;margin:18px 0 0">
                        ¿Recordaste tu contraseña?
                        <a href="login.html"
                           style="color:#0865dc;font-weight:800">
                            Inicia sesión
                        </a>
                    </p>

                </div>

                <a href="index.html" class="muted"
                   style="display:block;text-align:center;margin-top:18px">
                    ← Volver al inicio
                </a>

            </div>
        </section>

    </main>

    <script src="assets/js/notificaciones.js"></script>
    <script src="assets/js/autenticacion.js"></script>
<script src="assets/js/vista_contraseñas.js"></script>
</body>
</html>
