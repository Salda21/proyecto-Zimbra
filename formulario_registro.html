<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario</title>
    <link rel="stylesheet" href="CSS/estilo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="contenedor-formulario">
    <div class="slider">
        <h1>Zimbra</h1>
        <p>Tu espacio de comunicación y productividad</p>
    </div>
    <h2>Crear cuenta</h2>
    <p class="descripcion">Únete a nuestra comunidad</p>

    <form action="PHP/registrar.php" method="POST" id="formRegistro">
        <div class="grupo-campo">
            <label>Nombre completo</label>
            <input type="text" name="nombre" id="nombre"
                   placeholder="Tu nombre completo" required>
            <small class="mensaje-error" id="errorNombre"></small>
        </div>

        <div class="grupo-campo">
            <label>Correo electrónico</label>
            <input type="email" name="email" id="email"
                   placeholder="correo@ejemplo.com" required>
            <small class="mensaje-error" id="errorEmail"></small>
        </div>

        <div class="grupo-campo">
            <label>Contraseña</label>
            <input type="password" name="password" id="password"
                   placeholder="Mínimo 8 caracteres" required>
            <small class="mensaje-error" id="errorPassword"></small>
        </div>

        <div class="grupo-campo">
            <label>Confirmar contraseña</label>
            <input type="password" id="confirmarPassword"
                   placeholder="Repite tu contraseña" required>
            <small class="mensaje-error" id="errorConfirmar"></small>
        </div>

        <button type="submit" class="btn-principal">
            Registrarme
        </button>

    </form>

    <p>¿Ya tienes cuenta?
        <a href="login.html" class="enlace">Inicia sesión</a>
    </p>
</div>
</body>
</html>
