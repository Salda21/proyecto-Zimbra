
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ZimbraConnect</title>

    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/autenticacion.css">
    <link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>

    <main class="auth-page">

        <aside class="auth-brand">
            <div class="plane">➤</div>
            <h2>ZimbraConnect</h2>
            <p>Tu espacio de comunicación y productividad</p>
        </aside>

        <section class="auth-panel">
            <div class="auth-card card">

                <div id="login">

                    <div class="eyebrow">Bienvenido nuevamente</div>

                    <h1>Iniciar sesión</h1>

                    <p class="muted">
                        Ingresa tus credenciales para continuar.
                    </p>

                    <form id="loginForm" action="PHP/login.php" method="POST" novalidate>

                        <div class="field">
                            <label>Correo electrónico</label>
                            <input type="email" required
                                placeholder="correo@empresa.com">
                        </div>

                        <div class="field">
                            <label>Contraseña</label>
                            <input type="password" required
                                placeholder="Tu contraseña">
                        </div>

                        <button class="btn btn-primary" type="submit">
                            Ingresar
                        </button>

                    </form>

                    <p class="muted" style="text-align:center;margin:18px 0 0">
                        ¿Todavía no tienes cuenta?
                        <a href="registro.html"
                           style="color:#0865dc;font-weight:800">
                            Regístrate aquí
                        </a>
                    </p>

                </div>

                <a href="index.html" class="muted"
                   style="display:block;text-align:center;margin-top:18px">
                    ← Volver al inicio
                </a>

            </div>
        </section>

    </main>

    <script src="assets/js/notificaciones.js"></script>
    <!--<script src="assets/js/autenticacion.js"></script>-->
    <script src="assets/js/validar_login.js"></script>

</body>
</html>
