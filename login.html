<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - ZimbraConnect</title>

    <link rel="stylesheet" href="CSS/estilo.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="contenedor-formulario">

    <h2>Bienvenido a Zimbra</h2>
    <p class="descripcion">Ingresa a tu cuenta</p>

    <form action="PHP/login.php" method="POST" id="formLogin" novalidate>

        <div class="grupo-campo">
            <label for="email">Correo electrónico</label>

            <input
                type="email"
                name="email"
                id="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <small class="mensaje-error" id="errorEmail"></small>
        </div>

        <div class="grupo-campo">
            <label for="password">Contraseña</label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Tu contraseña"
                required
            >

            <small class="mensaje-error" id="errorPassword"></small>
        </div>

        <button type="submit" class="btn-principal">
            Iniciar sesión
        </button>

    </form>

    <p>¿No tienes cuenta?
        <a href="formulario_registro.html" class="enlace">
            Regístrate
        </a>
    </p>

</div>

<script src="JS/validar_login.js"></script>
</body>
</html>
